services:
  db:
    image: postgres:15
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend

  api:
    build: .
    ports:
      - "5000:5000"
    env_file:
      - .env
    depends_on:
      - db
    networks:
      - backend

  web:
    build: ./client
    ports:
      - "3000:80"
    networks:
      - frontend

networks:
  backend:
    internal: true
  frontend:

volumes:
  postgres_data:
